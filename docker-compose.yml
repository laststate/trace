services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/trace || true;
      exit 0;
      "

  trace:
    build: .
    ports:
      - "8080:8080"
    environment:
      TRACE_LISTEN: ":8080"
      TRACE_PUBLIC_URL: "http://localhost:8080"
      TRACE_DATABASE_URL: "postgres://trace:trace@db:5432/trace?sslmode=disable"
      TRACE_OBJECT_DIR: "/data/objects"
      TRACE_WEB_DIR: "/app/web/dist"
      TRACE_BOOTSTRAP: "true"
      TRACE_WORKERS: "2"
      TRACE_OPEN_UI: "true"
      TRACE_ADMIN_EMAIL: "admin@localhost"
      TRACE_ADMIN_PASSWORD: "admin"
      # optional MinIO (comment out to use FS only)
      TRACE_S3_ENDPOINT: "http://minio:9000"
      TRACE_S3_BUCKET: "trace"
      TRACE_S3_REGION: "us-east-1"
      TRACE_S3_ACCESS_KEY: "minio"
      TRACE_S3_SECRET_KEY: "minio12345"
    volumes:
      - tracedata:/data
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully

volumes:
  pgdata:
  tracedata:
  miniodata:
