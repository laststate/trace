services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20

  trace:
    build: .
    ports:
      - "8080:8080"
    environment:
      TRACE_LISTEN: ":8080"
      TRACE_PUBLIC_URL: "http://localhost:8080"
      TRACE_DATABASE_URL: "postgres://trace:trace@db:5432/trace?sslmode=disable"
      TRACE_OBJECT_DIR: "/data/objects"
      TRACE_WEB_DIR: "/app/web/dist"
      TRACE_BOOTSTRAP: "true"
      TRACE_WORKERS: "2"
    volumes:
      - tracedata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  tracedata:
